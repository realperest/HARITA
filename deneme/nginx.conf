# HARITA deneme sayfasi nginx ayari.
# Sayfa dosyalari her istekte yeniden dogrulanir (ETag ile 304), boylece yeni dagitimdan sonra
# tarayici onbellekteki eski deneme.js / surum.json dosyasini kullanmaz.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Ortam degiskenlerinden uretilen anahtar dosyasi hic onbelleklenmez
    location = /yapilandirma.json {
        add_header Cache-Control "no-store" always;
    }
}
