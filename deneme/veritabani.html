<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HARITA Veritabanı</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="veritabani.css">
</head>
<body>
  <header class="ust">
    <span class="marka">HARITA <span class="soluk">veritabanı</span></span>
    <nav class="ust-baglanti">
      <a href="index.html">Harita denemesi</a>
      <button class="dugme ikincil" id="cikis" type="button" hidden>Çıkış</button>
    </nav>
  </header>

  <main id="giris-alani" class="giris" hidden>
    <form id="giris-form" class="kart giris-kart" autocomplete="off">
      <h1>Yönetim girişi</h1>
      <p class="soluk">Veritabanını görmek için yönetim anahtarını girin. Anahtar yalnız bu sekmede tutulur.</p>
      <label class="alan">API adresi
        <input class="girdi" id="api-adres" type="url" required>
      </label>
      <label class="alan">Yönetim anahtarı
        <input class="girdi" id="yonetim-anahtar" type="password" required autocomplete="off">
      </label>
      <button class="dugme" type="submit">Giriş</button>
      <div id="giris-mesaj" class="mesaj" role="status"></div>
    </form>
  </main>

  <main id="uygulama" class="uygulama" hidden>
    <section class="ozet" id="ozet" aria-label="Veritabanı özeti"></section>
    <div class="ana">
      <aside class="yan kart">
        <input class="girdi" id="tablo-ara" type="search" placeholder="Tablo ara" aria-label="Tablo ara">
        <label class="onay"><input type="checkbox" id="gorunum-goster"> Görünümleri göster</label>
        <button class="tablo-oge sql-oge" id="sql-ac" type="button">SQL komutu</button>
        <ul class="tablo-liste" id="tablo-liste"></ul>
      </aside>
      <section class="icerik kart" id="icerik">
        <p class="soluk">Soldan bir tablo seçin.</p>
      </section>
    </div>
  </main>

  <footer class="surum" id="surum" aria-label="Sürüm geçmişi"></footer>
  <script type="module" src="veritabani.js?v=261031.1600"></script>
</body>
</html>
