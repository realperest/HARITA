# HARITA: tum projelerin ortak harita servisi (karo + rota + adres arama + anahtar kapisi).
# Coolify'da "Docker Compose" kaynagi olarak yayinlanir. Gizli degerler Coolify ortam degiskenlerinden gelir.
# Veritabani (PostGIS) ve Redis Coolify'in kendi kaynaklari olarak ayri calisir (harita-db, harita-redis); bu uygulama Coolify aginin ortak aginda onlara baglanir.
# Alan adlari: tiles -> karo alan adi, gateway -> API alan adi (Coolify panelinde atanir). Diger servisler yalniz ic aginda.

services:
  # Vektor karolar (PMTiles) + yazi tipleri + simgeler. Ilk acilista Protomaps gunluk yapisindan Turkiye kesitini indirir.
  tiles:
    mem_limit: 1g
    cpus: 1.0
    build: ./services/tiles
    restart: unless-stopped
    environment:
      KAPSAM_KUTUSU: ${KAPSAM_KUTUSU:-25.6,35.8,44.9,42.2}
      MAKS_YAKINLASTIRMA: ${MAKS_YAKINLASTIRMA:-15}
      IZINLI_KOKEN_REGEX: ${IZINLI_KOKEN_REGEX:-.*}
      KARO_GENEL_ADRESI: ${KARO_GENEL_ADRESI:?KARO_GENEL_ADRESI gerekli}
    volumes:
      - harita_karo:/veri
    expose:
      - "8080"

  # Rota, matris, izokron (Valhalla). Ilk acilista Geofabrik Turkiye verisinden cizge uretir (saatler surmez, ~20-60 dk).
  # Her ayin 1'inde 05:00'ten (Turkiye saati) yeni cizge yan klasorde kurulur, dogrulanir ve degistirilir; eskisi .yedek kalir.
  rota:
    # Ortak sunucuyu korumak icin sinirli; asarsa yalniz bu konteyner durur (diger projeler etkilenmez)
    mem_limit: 6g
    cpus: 2.0
    build: ./services/rota
    restart: unless-stopped
    command: ["build_tiles"]
    environment:
      tile_urls: ${OSM_VERI_ADRESI:-https://download.geofabrik.de/europe/turkey-latest.osm.pbf}
      server_threads: ${ROTA_IS_PARCACIGI:-2}
      use_tiles_ignore_pbf: "True"
      build_admins: "True"
      build_time_zones: "True"
      # Yukseklik (rakim, egim) verisi: acmak icin ROTA_YUKSEKLIK=True ve bir kez ROTA_YENIDEN_KUR=True (bkz. docs/YAYIN.md)
      build_elevation: "${ROTA_YUKSEKLIK:-False}"
      force_rebuild: "${ROTA_YENIDEN_KUR:-False}"
      serve_tiles: "True"
    volumes:
      - harita_rota2:/custom_files
    expose:
      - "8002"

  # Cok araçli / cok kuryeli rota planlama (VROOM). Sure-mesafe matrisini gateway Valhalla'dan alip hazir verir;
  # bu servis yol verisi tutmaz, yalniz atama ve siralama problemini cozer. Yalniz ic agda.
  plan:
    mem_limit: 512m
    cpus: 1.0
    image: ghcr.io/vroom-project/vroom-docker:v1.14.0
    restart: unless-stopped
    environment:
      VROOM_ROUTER: valhalla
    expose:
      - "3000"

  # Yerlesim yukleyicisi: Turkiye il / ilce / mahalle-koy sinirlari ve sehir-kasaba-koy-mezra-semt merkezlerini OSM'den yukler,
  # her ayin 1 inde 05:00 (Turkiye saati) tazeler. Semayi gateway kurar; yukleyici hazir olana kadar bekler.
  veri:
    mem_limit: 2g
    cpus: 1.0
    build: ./services/veri
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://harita:${DB_SIFRE:?DB_SIFRE gerekli}@${DB_ADRESI:-mjvz7cconglhimakyiainj6q}:5432/harita
      VERI_ADRESI: ${OSM_VERI_ADRESI:-https://download.geofabrik.de/europe/turkey-latest.osm.pbf}
    volumes:
      - harita_veri:/veri

  # Anahtar kapisi: proje anahtari, izin, kota, kullanim sayaci; OSRM uyumlu rota ucu dahil.
  gateway:
    mem_limit: 512m
    cpus: 1.0
    build: ./services/gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://harita:${DB_SIFRE:?DB_SIFRE gerekli}@${DB_ADRESI:-mjvz7cconglhimakyiainj6q}:5432/harita
      REDIS_URL: redis://default:${REDIS_SIFRE:?REDIS_SIFRE gerekli}@${REDIS_ADRESI:-95hm6k1qwzorg8isilwivryt}:6379/0
      YONETIM_ANAHTARI: ${YONETIM_ANAHTARI:?YONETIM_ANAHTARI gerekli}
      ROTA_ADRESI: http://rota:8002
      PLAN_ADRESI: http://plan:3000
      HAVA_ADRESI: ${HAVA_ADRESI:-https://api.open-meteo.com}
      HAVA_ANAHTARI: ${HAVA_ANAHTARI:-}
      KARO_ADRESI: ${KARO_GENEL_ADRESI:?KARO_GENEL_ADRESI gerekli}
      LOG_SEVIYESI: ${LOG_SEVIYESI:-INFO}
    expose:
      - "8000"

volumes:
  harita_veri:
  harita_karo:
  harita_rota2:
